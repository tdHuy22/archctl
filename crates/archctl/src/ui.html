<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>archctl</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --line: #e3e3e0; --ink: #1c1c1a; --muted: #6b6b66;
    --accent: #2f6f4f; --accent-soft: #e8f1ec;
    --bad: #b3261e; --bad-soft: #fdecea;
    --warn: #8a6100; --warn-soft: #fdf3e0;
    --store: #5b4b8a; --api: #8a5a1f; --ext: #4a6b8a; --svc: #1f6f8a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161715; --panel: #1e201d; --line: #32352f; --ink: #eceae4; --muted: #9a9a92;
      --accent: #74b48f; --accent-soft: #23302a;
      --bad: #f0877e; --bad-soft: #352422;
      --warn: #d9ad5b; --warn-soft: #332b1c;
      --store: #a695d8; --api: #d9a86a; --ext: #8fb0d0; --svc: #6cc0d8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex: none;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
  header .hash { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  .pill {
    padding: 2px 9px; border-radius: 999px; font-size: 12px;
    background: var(--accent-soft); color: var(--accent); white-space: nowrap;
  }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  button {
    font: inherit; padding: 5px 11px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .45; cursor: default; }
  main { flex: 1; display: flex; min-height: 0; }
  #canvas { flex: 1; min-width: 0; cursor: grab; touch-action: none; }
  #canvas.panning { cursor: grabbing; }
  aside {
    width: 348px; flex: none; border-left: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  nav { display: flex; border-bottom: 1px solid var(--line); flex: none; }
  nav button {
    flex: 1; border: 0; border-radius: 0; border-bottom: 2px solid transparent;
    background: none; color: var(--muted); padding: 10px 4px;
  }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tab { display: none; overflow: auto; padding: 14px 16px; }
  .tab[data-on] { display: block; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .card {
    border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; margin-bottom: 10px;
  }
  .card.bad { border-color: var(--bad); }
  .card h4 { margin: 0 0 5px; font-size: 13px; font-weight: 600; }
  .card p { margin: 3px 0; color: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .where { color: var(--muted); }
  .hint { color: var(--accent); }
  .muted { color: var(--muted); }
  .faded { opacity: .55; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; word-break: break-word; }
  .row { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; }
  textarea {
    width: 100%; min-height: 58px; resize: vertical; font: inherit; padding: 7px 8px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink);
  }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 16px; border-top: 1px solid var(--line);
            color: var(--muted); font-size: 12px; background: var(--panel); flex: none; }
  .legend span::before { content: ""; display: inline-block; width: 11px; height: 11px;
                         border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .lg-component::before { background: var(--accent); }
  .lg-store::before { background: var(--store); }
  .lg-api::before { background: var(--api); }
  .lg-ext::before { background: var(--ext); }
  .lg-svc::before { background: var(--svc); border-radius: 6px; }
  .lg-bad::before { background: var(--bad); }
  #fault { padding: 24px; color: var(--bad); white-space: pre-wrap; }
  .node { cursor: pointer; }
  .node text { pointer-events: none; user-select: none; }
  #canvas.connecting, #canvas.connecting .node { cursor: crosshair; }
  button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .edge-hit { cursor: pointer; }
  dialog {
    width: min(560px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 12px;
    background: var(--panel); color: var(--ink); padding: 18px 20px;
  }
  dialog::backdrop { background: rgb(0 0 0 / .35); }
  dialog h3 { margin: 0 0 12px; font-size: 15px; }
  .field { display: block; margin: 0 0 10px; }
  .field > span { display: block; color: var(--muted); margin-bottom: 3px; }
  input[type=text], select {
    width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 7px; background: var(--bg); color: var(--ink);
  }
  textarea.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; min-height: 110px; }
  pre.preview {
    margin: 4px 0 12px; padding: 8px 10px; border-radius: 7px; background: var(--bg);
    border: 1px dashed var(--line); white-space: pre-wrap; word-break: break-word;
  }
  .ed-error { color: var(--bad); background: var(--bad-soft); border-radius: 7px; padding: 8px 10px; margin: 0 0 10px; white-space: pre-wrap; }
  .row.end { justify-content: flex-end; }
  .decl { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin-bottom: 8px; }
  .decl pre { margin: 0 0 6px; white-space: pre-wrap; word-break: break-word; }
  .decl button, .actions button { padding: 3px 9px; }
  .badge { font-size: 11px; color: var(--muted); }
</style>

<header>
  <h1>archctl</h1>
  <span class="hash" id="hash"></span>
  <span class="pill" id="scanned"></span>
  <span class="pill bad" id="broken" hidden></span>
  <span class="pill warn" id="waiting" hidden></span>
  <span class="pill warn" id="stale" hidden></span>
  <span class="spacer"></span>
  <button id="add" class="primary" title="Thêm component, luật hay khai báo khác vào system.arch">+ Thêm</button>
  <button id="connect" aria-pressed="false" title="Bật rồi kéo từ hộp này sang hộp kia để thêm allow, deny hay link">Nối mũi tên</button>
  <button id="relayout">Sắp xếp lại</button>
</header>

<main>
  <svg id="canvas"></svg>
  <aside>
    <nav>
      <button data-tab="detail" aria-selected="true">Chi tiết</button>
      <button data-tab="violations" aria-selected="false">Vi phạm</button>
      <button data-tab="stale" aria-selected="false">Lạc hậu</button>
      <button data-tab="proposals" aria-selected="false">Đề xuất</button>
      <button data-tab="decls" aria-selected="false">Khai báo</button>
    </nav>
    <div class="tab" data-tab="detail" data-on></div>
    <div class="tab" data-tab="violations"></div>
    <div class="tab" data-tab="stale"></div>
    <div class="tab" data-tab="proposals"></div>
    <div class="tab" data-tab="decls"></div>
  </aside>
</main>

<dialog id="editor">
  <form id="ed-form">
    <h3 id="ed-title"></h3>
    <div id="ed-body"></div>
    <label class="field"><span>Lý do — bắt buộc, ghi vào <code>decisions.md</code> để agent biết vì sao luật đổi</span>
      <textarea id="ed-reason"></textarea></label>
    <div id="ed-error" class="ed-error" hidden></div>
    <div class="row end">
      <button type="button" id="ed-cancel">Huỷ</button>
      <button type="button" id="ed-extra" class="danger" hidden></button>
      <button type="submit" class="primary" id="ed-ok">Ghi vào system.arch</button>
    </div>
  </form>
</dialog>

<div class="legend">
  <span class="lg-component">component</span>
  <span class="lg-store">kho dữ liệu</span>
  <span class="lg-api">nhóm api</span>
  <span class="lg-ext">bên ngoài</span>
  <span class="lg-svc">service (nét chấm: chạy mã nào)</span>
  <span class="lg-bad">vi phạm</span>
  <span>nét đứt = chưa có hiệu lực</span>
  <span>viền đậm = đã khoá</span>
</div>

<script>
const NODE_W = 180, NODE_H = 56, SVG_NS = "http://www.w3.org/2000/svg";
const KIND_COLOR = { component: "--accent", store: "--store", api: "--api", external: "--ext", service: "--svc" };
// Service có không gian tên riêng nên node của nó mang tiền tố; nhãn thì không.
const SVC = "svc:";
const label = (name) => String(name ?? "").startsWith(SVC) ? String(name).slice(SVC.length) : String(name ?? "");
const STATUS_ORDER = ["#draft", "#proposed", "#accepted", "#locked"];

const canvas = document.getElementById("canvas");
const view = { x: 0, y: 0, k: 1 };
let model = null, selected = null, drag = null, fitNext = true;
// Mũi tên đang chọn, và chế độ "Nối mũi tên": kéo từ hộp này sang hộp kia.
let selectedEdge = null, connectMode = false;
const sameEdge = (a, b) => a.from === b.from && a.to === b.to && a.kind === b.kind;
// Người đã tự kéo hoặc phóng thì đừng canh lại nữa — đó là khung nhìn của họ.
let userMoved = false;
// Nhãn cạnh hay rơi trùng chỗ khi nhiều cạnh cùng đi qua một vùng.
const usedLabels = new Set();

// Canh sơ đồ vừa khung lúc mở. Không canh lại ở mỗi lần cập nhật: màn hình
// tự nhảy khi agent vừa sửa một chỗ thì rất khó theo dõi.
function fitToView() {
  if (!model?.nodes.length) return;
  const pad = 56;
  const minX = Math.min(...model.nodes.map((n) => n.x)) - pad;
  const minY = Math.min(...model.nodes.map((n) => n.y)) - pad;
  const maxX = Math.max(...model.nodes.map((n) => n.x + NODE_W)) + pad;
  const maxY = Math.max(...model.nodes.map((n) => n.y + NODE_H)) + pad;
  const box = canvas.getBoundingClientRect();
  // Sàn thấp, vì thấy toàn cảnh quan trọng hơn đọc được chữ. Một sơ đồ 24
  // component rộng gấp sáu lần khung nhìn: giữ sàn cao thì người mở ra chỉ
  // thấy một góc và không biết còn gì ở ngoài. Chữ nhỏ quá thì ẩn đi.
  const fit = Math.min(box.width / (maxX - minX), box.height / (maxY - minY));
  view.k = Math.min(1.1, Math.max(0.2, fit));
  view.x = (box.width - (maxX - minX) * view.k) / 2 - minX * view.k;
  view.y = (box.height - (maxY - minY) * view.k) / 2 - minY * view.k;
}

const el = (name, attrs = {}, text) => {
  const node = document.createElementNS(SVG_NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
};
// Mọi chữ đưa vào HTML đi qua đây: tên, đường dẫn, đề xuất đều có thể do
// agent viết, và một script lọt vào trang này chạy được với khoá phiên.
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

// Khoá phiên nằm trong địa chỉ mà `archctl serve` in ra. Nó phân biệt người
// đang mở trang với agent đang chạy cùng máy — `curl` vào đây không có nó.
const sessionKey = new URLSearchParams(location.search).get("k") || "";

async function post(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "X-Archctl-Key": sessionKey },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({ ok: false, error: "máy chủ không trả lời" }));
  if (!data.ok) alert(data.error || "không thực hiện được");
  return data.ok;
}

async function refresh() {
  const res = await fetch("/api/model", { headers: { "X-Archctl-Key": sessionKey } });
  const next = await res.json();
  if (next.error) { showFault(next); return; }
  model = next;
  model.byName = Object.fromEntries(model.nodes.map((n) => [n.name, n]));
  model.byLine = Object.fromEntries((model.decls || []).map((d) => [d.line, d]));
  // Phần tử đã chọn có thể vừa bị xoá hay đổi tên.
  if (selected && !model.byName[selected]) selected = null;
  // Mũi tên đang chọn lấy lại số dòng mới: thêm một dòng phía trên là luật
  // của nó dời xuống, và bảng chi tiết sẽ hiện nhầm luật khác.
  if (selectedEdge && selectedEdge.kind !== "violation") {
    const now = model.edges.find((e) => sameEdge(e, selectedEdge));
    selectedEdge = now ? { ...selectedEdge, line: now.line } : null;
  } else if (selectedEdge && !model.violations.some((v) => v.from === selectedEdge.from && v.to === selectedEdge.to)) {
    selectedEdge = null;
  }
  document.getElementById("fault")?.remove();
  if (fitNext) { fitNext = false; fitToView(); }
  draw();
  summarize();
  renderTabs();
}

function showFault(data) {
  document.getElementById("fault")?.remove();
  const box = document.createElement("div");
  box.id = "fault";
  box.textContent = data.error + "\n\n" + (data.errors || []).join("\n");
  document.querySelector("main").prepend(box);
  canvas.replaceChildren();
}

function summarize() {
  document.getElementById("hash").textContent = model.archHash;
  document.getElementById("scanned").textContent = `${model.stats.files} file · ${model.stats.checked.length}/${model.nodes.length} trong diện kiểm`;
  const fresh = model.violations.filter((v) => !v.baselined);
  toggle("broken", fresh.length, `${fresh.length} vi phạm`);
  toggle("waiting", model.proposals.length, `${model.proposals.length} chờ duyệt`);
  // Hai vấn đề khác nhau của cùng một thứ: khai báo không còn khớp mã, và
  // khai báo mà kiểm xong vẫn không biết gì. Cái thứ hai dễ bị bỏ qua hơn.
  const declareIssues = model.missing.length + model.vacuous.length + model.unproven.length + (model.deploy || []).length;
  const parts = [];
  if (model.missing.length) parts.push(`${model.missing.length} lạc hậu`);
  if (model.vacuous.length) parts.push(`${model.vacuous.length} không kết luận`);
  if (model.unproven.length) parts.push(`${model.unproven.length} chưa chứng minh`);
  if ((model.deploy || []).length) parts.push(`${model.deploy.length} hạ tầng`);
  toggle("stale", declareIssues, parts.join(" · "));
}
const toggle = (id, count, text) => {
  const node = document.getElementById(id);
  node.hidden = !count;
  node.textContent = text;
};

// ---------- vẽ sơ đồ ----------

function violatingPairs() {
  const pairs = new Map();
  for (const v of model.violations) {
    if (v.baselined) continue;
    const key = v.from + "\u0000" + v.to;
    pairs.set(key, (pairs.get(key) || 0) + 1);
  }
  return pairs;
}

function draw() {
  const root = el("g", { transform: `translate(${view.x} ${view.y}) scale(${view.k})` });
  const defs = el("defs");
  for (const [id, color] of [["a", "--muted"], ["bad", "--bad"]]) {
    const marker = el("marker", {
      id: `arrow-${id}`, viewBox: "0 0 10 10", refX: 9, refY: 5,
      markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse",
    });
    marker.append(el("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: `var(${color})` }));
    defs.append(marker);
  }
  canvas.replaceChildren(defs, root);

  const broken = violatingPairs();
  usedLabels.clear();
  drawBoundaries(root);
  for (const e of model.edges) drawEdge(root, e, broken);
  for (const [key, count] of broken) {
    const [from, to] = key.split("\u0000");
    drawEdge(root, { from, to, kind: "violation", count }, broken);
  }
  for (const n of model.nodes) drawNode(root, n, broken);
}

// Khung chỉ được vẽ khi nó bao đúng thành viên của boundary. Một component
// ngoài lọt vào trong khung thì người xem đọc sai kiến trúc — nên trường hợp
// đó chuyển sang gắn nhãn lên từng hộp, cách này không bao giờ sai.
const boundaryTags = new Map();

function drawBoundaries(root) {
  boundaryTags.clear();
  for (const b of model.boundaries) {
    const inside = b.contains.map((n) => model.byName[n]).filter(Boolean);
    if (!inside.length) continue;
    const pad = 22;
    const box = {
      x: Math.min(...inside.map((n) => n.x)) - pad,
      y: Math.min(...inside.map((n) => n.y)) - pad - 14,
    };
    box.w = Math.max(...inside.map((n) => n.x + NODE_W)) + pad - box.x;
    box.h = Math.max(...inside.map((n) => n.y + NODE_H)) + pad - box.y;

    const members = new Set(b.contains);
    const intruder = model.nodes.some((n) =>
      !members.has(n.name) &&
      n.x + NODE_W > box.x && n.x < box.x + box.w &&
      n.y + NODE_H > box.y && n.y < box.y + box.h);

    if (intruder) {
      for (const n of inside) boundaryTags.set(n.name, b.name);
      continue;
    }
    root.append(el("rect", {
      x: box.x, y: box.y, width: box.w, height: box.h, rx: 14,
      fill: "none", stroke: "var(--line)", "stroke-width": 1.5, "stroke-dasharray": "2 4",
    }));
    root.append(el("text",
      { x: box.x + 12, y: box.y + 16, fill: "var(--muted)", "font-size": 11 }, b.name));
  }
}

// Cạnh rời mép phải và vào mép trái, uốn bằng bezier. Đường thẳng nối tâm
// hai hộp sẽ xuyên qua những hộp nằm giữa; đi vòng theo chiều của layout thì
// gần như không bao giờ chạm vào ai.
function edgePath(from, to) {
  const forward = to.x >= from.x;
  const a = { x: forward ? from.x + NODE_W : from.x, y: from.y + NODE_H / 2 };
  const b = { x: forward ? to.x : to.x + NODE_W, y: to.y + NODE_H / 2 };
  const reach = Math.max(42, Math.abs(b.x - a.x) * 0.45);
  const c1 = { x: a.x + (forward ? reach : -reach), y: a.y };
  const c2 = { x: b.x + (forward ? -reach : reach), y: b.y };
  return {
    d: `M${a.x} ${a.y} C${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${b.x} ${b.y}`,
    mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 + (forward ? 0 : -14) },
  };
}

function drawEdge(root, e, broken) {
  const from = model.byName[e.from], to = model.byName[e.to];
  if (!from || !to || from === to) return;
  // Cạnh vi phạm đã vẽ riêng, đừng vẽ chồng lên luật cùng cặp.
  if (e.kind !== "violation" && broken.has(e.from + "\u0000" + e.to)) return;

  const { d, mid } = edgePath(from, to);
  const violation = e.kind === "violation";
  const draft = e.status && e.status !== "#accepted" && e.status !== "#locked";
  // `runs` không phải phụ thuộc mà là "chạy ở đâu": vẽ mờ để không lẫn với luật.
  const runs = e.kind === "runs";
  const picked = selectedEdge && sameEdge(e, selectedEdge);

  root.append(el("path", {
    d, fill: "none",
    stroke: violation ? "var(--bad)" : e.kind === "deny" ? "var(--warn)"
      : e.kind === "link" || runs ? "var(--svc)" : "var(--muted)",
    "stroke-width": picked ? 3.4 : violation ? 2.5 : e.kind === "link" ? 1.8 : 1.4,
    "stroke-dasharray": runs ? "1 4" : draft ? "5 4" : e.kind === "deny" ? "2 3" : "",
    "marker-end": runs ? "" : `url(#arrow-${violation ? "bad" : "a"})`,
    opacity: picked || violation ? 1 : runs ? 0.45 : draft ? 0.6 : 0.85,
  }));
  // Vùng bấm rộng hơn nét vẽ, để chọn được mũi tên mà gỡ hay sửa luật.
  const hit = el("path", { d, fill: "none", stroke: "transparent", "stroke-width": 12, class: "edge-hit" });
  hit.addEventListener("pointerdown", (ev) => {
    ev.stopPropagation();
    selectedEdge = { from: e.from, to: e.to, kind: e.kind, line: e.line };
    selected = null;
    showTab("detail");
    renderTabs();
    draw();
  });
  root.append(hit);

  const label = view.k < 0.45 ? ""
    : violation ? (e.count > 1 ? `${e.count} vi phạm` : "vi phạm") : e.kind === "deny" ? "cấm" : "";
  if (label) {
    const mx = mid.x;
    let my = mid.y;
    for (let i = 0; i < 8; i++) {
      const slot = `${Math.round(mx / 24)}:${Math.round(my / 14)}`;
      if (!usedLabels.has(slot)) { usedLabels.add(slot); break; }
      my += 15;
    }
    root.append(el("rect", {
      x: mx - label.length * 3.4 - 4, y: my - 9, width: label.length * 6.8 + 8, height: 16, rx: 4,
      fill: "var(--panel)",
    }));
    root.append(el("text", {
      x: mx, y: my + 3, "text-anchor": "middle", "font-size": 11,
      fill: violation ? "var(--bad)" : "var(--warn)",
    }, label));
  }
}

function nodeShape(n) {
  const { x, y } = n, w = NODE_W, h = NODE_H;
  if (n.kind === "store") return el("path", { d: `M${x} ${y + 9} a${w / 2} 9 0 0 1 ${w} 0 v${h - 18} a${w / 2} 9 0 0 1 ${-w} 0 z` });
  if (n.kind === "api") return el("path", { d: `M${x + 13} ${y} H${x + w} L${x + w - 13} ${y + h} H${x} z` });
  if (n.kind === "service") return el("rect", { x, y, width: w, height: h, rx: h / 2 });
  return el("rect", { x, y, width: w, height: h, rx: 9 });
}

function drawNode(root, n, broken) {
  const faulty = [...broken.keys()].some((k) => k.startsWith(n.name + "\u0000"));
  const draft = n.status === "#draft" || n.status === "#proposed";
  const g = el("g", { class: "node" });

  const shape = nodeShape(n);
  shape.setAttribute("fill", "var(--panel)");
  shape.setAttribute("stroke", faulty ? "var(--bad)" : `var(${KIND_COLOR[n.kind]})`);
  shape.setAttribute("stroke-width", n.status === "#locked" ? 2.6 : 1.4);
  if (draft) shape.setAttribute("stroke-dasharray", "5 4");
  if (selected === n.name) shape.setAttribute("filter", "drop-shadow(0 0 0 2px var(--accent))");
  g.append(shape);

  const cx = n.x + NODE_W / 2;
  // Dưới các mức này chữ thành vệt mờ, đọc đã không được mà còn che mất hình
  // dạng tổng thể — thứ duy nhất còn đọc được ở mức thu nhỏ đó.
  const showName = view.k >= 0.25;
  const showSub = view.k >= 0.45;
  if (showName) {
    g.append(el("text", {
      x: cx, y: n.y + (n.sub && showSub ? 24 : 32), "text-anchor": "middle", "font-size": 13,
      "font-weight": 600, fill: faulty ? "var(--bad)" : "var(--ink)",
    }, label(n.name).length > 20 ? label(n.name).slice(0, 19) + "…" : label(n.name)));
  }
  if (n.sub && showSub) {
    const short = n.sub.length > 26 ? n.sub.slice(0, 25) + "…" : n.sub;
    g.append(el("text", {
      x: cx, y: n.y + 39, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)",
    }, short));
  }
  const tag = boundaryTags.get(n.name);
  if (tag && showSub) {
    g.append(el("text", {
      x: n.x + 9, y: n.y - 5, "font-size": 10, fill: "var(--muted)",
    }, `⌜ ${tag}`));
  }
  if (n.status === "#locked") {
    // Chấm tròn thay cho emoji: emoji hiện thành ô vuông trên nhiều hệ.
    g.append(el("circle", { cx: n.x + NODE_W - 13, cy: n.y + 13, r: 3.2, fill: "var(--muted)" }));
  }
  if (draft) g.setAttribute("opacity", ".75");

  g.addEventListener("pointerdown", (ev) => startDrag(ev, n));
  root.append(g);
}

// ---------- tương tác ----------

function toWorld(ev) {
  const box = canvas.getBoundingClientRect();
  return { x: (ev.clientX - box.left - view.x) / view.k, y: (ev.clientY - box.top - view.y) / view.k };
}

function startDrag(ev, node) {
  ev.stopPropagation();
  const at = toWorld(ev);
  canvas.setPointerCapture(ev.pointerId);
  if (connectMode) {
    drag = { link: node, at };
    return;
  }
  drag = { node, dx: at.x - node.x, dy: at.y - node.y, moved: false };
  selected = node.name;
  selectedEdge = null;
  showTab("detail");
  renderTabs();
  draw();
}

const nodeAt = (p) => model.nodes.find((n) =>
  p.x >= n.x && p.x <= n.x + NODE_W && p.y >= n.y && p.y <= n.y + NODE_H);

canvas.addEventListener("pointerdown", (ev) => {
  drag = { pan: true, x: ev.clientX - view.x, y: ev.clientY - view.y };
  canvas.classList.add("panning");
  canvas.setPointerCapture(ev.pointerId);
});

canvas.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  if (drag.link) {
    // Dây cao su từ hộp nguồn tới con trỏ.
    drag.at = toWorld(ev);
    draw();
    const from = drag.link;
    canvas.lastChild.append(el("line", {
      x1: from.x + NODE_W / 2, y1: from.y + NODE_H / 2, x2: drag.at.x, y2: drag.at.y,
      stroke: "var(--accent)", "stroke-width": 2, "stroke-dasharray": "4 3", "pointer-events": "none",
    }));
    return;
  }
  userMoved = true;
  if (drag.pan) {
    view.x = ev.clientX - drag.x;
    view.y = ev.clientY - drag.y;
  } else {
    const at = toWorld(ev);
    drag.node.x = Math.round(at.x - drag.dx);
    drag.node.y = Math.round(at.y - drag.dy);
    drag.moved = true;
  }
  draw();
});

canvas.addEventListener("pointerup", (ev) => {
  canvas.classList.remove("panning");
  canvas.releasePointerCapture(ev.pointerId);
  if (drag?.link) {
    const from = drag.link, to = nodeAt(toWorld(ev));
    drag = null;
    draw();
    if (to && to !== from) openConnect(from, to);
    return;
  }
  if (drag && !drag.pan && drag.moved) {
    // Lưu vị trí để lần sau mở lại sơ đồ không nhảy chỗ.
    post("/api/layout", { name: drag.node.name, x: String(drag.node.x), y: String(drag.node.y) });
  }
  drag = null;
});

canvas.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const box = canvas.getBoundingClientRect();
  const px = ev.clientX - box.left, py = ev.clientY - box.top;
  const next = Math.min(2.4, Math.max(0.25, view.k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
  view.x = px - (px - view.x) * (next / view.k);
  view.y = py - (py - view.y) * (next / view.k);
  view.k = next;
  userMoved = true;
  draw();
}, { passive: false });

document.getElementById("relayout").addEventListener("click", async () => {
  if (await post("/api/relayout", {})) { fitNext = true; userMoved = false; refresh(); }
});

function showTab(name) {
  document.querySelectorAll("nav button").forEach((b) =>
    b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  document.querySelectorAll(".tab").forEach((t) => t.toggleAttribute("data-on", t.dataset.tab === name));
}
document.querySelectorAll("nav button").forEach((button) =>
  button.addEventListener("click", () => showTab(button.dataset.tab)));

document.getElementById("add").addEventListener("click", () => openDeclEditor(null));
document.getElementById("connect").addEventListener("click", (ev) => {
  connectMode = !connectMode;
  ev.currentTarget.setAttribute("aria-pressed", String(connectMode));
  canvas.classList.toggle("connecting", connectMode);
});

// ---------- bảng bên phải ----------

const tab = (name) => document.querySelector(`.tab[data-tab="${name}"]`);

function renderTabs() {
  renderDetail();
  renderViolations();
  renderStale();
  renderProposals();
  renderDecls();
}

// Khai báo nói một đằng, mã làm một nẻo. Không phải vi phạm luật, nhưng là
// dấu hiệu sơ đồ đã lạc hậu — và sơ đồ sai còn tệ hơn không có sơ đồ.
function renderStale() {
  const box = tab("stale");
  const stale = model.missing.map((m) => `
    <div class="card">
      <h4>${esc(m.source)} <span class="mono">${esc(m.name)}</span></h4>
      <p class="where mono">system.arch:${m.line}</p>
      <p class="hint">→ ${esc(m.hint)}</p>
    </div>`).join("");
  // Đã "pass" nhưng pass vì cái tên có mặt khắp nơi. Im lặng ở đây bị đọc
  // thành "chỗ này đã kiểm, không sao".
  const vague = model.vacuous.map((v) => `
    <div class="card">
      <h4>${esc(v.source)} <span class="mono">${esc(v.name)}</span></h4>
      <p class="where mono">system.arch:${v.line}</p>
      <p class="hint">được ${v.byDeclaration ? "khai báo" : "nhắc tới"} trong ${v.files}/${v.of} file nên tìm thấy nó không nói lên điều gì
        → đổi sang một tên chỉ thuộc về bước này</p>
    </div>`).join("");
  // Một lời hứa có `verify` trỏ tới đâu đó vẫn chỉ là lời hứa, chừng nào chưa
  // ai chạy nó trên đúng bản mã này.
  const unproven = model.unproven.map((u) => `
    <div class="card">
      <h4>cách kiểm <span class="mono">${esc(u.name)}</span></h4>
      <p class="hint">${esc(u.why)} → <span class="mono">archctl verify ${esc(u.name)}</span></p>
    </div>`).join("");
  // Tầng hạ tầng: cấu hình không đọc được, điểm vào không rõ, `link` không
  // thấy đâu. Không phải vi phạm, nhưng là chỗ đang không kiểm được.
  const deploy = (model.deploy || []).map((d) => `
    <div class="card">
      <h4>${esc(d.title)}</h4>
      <p class="hint">${esc(d.detail)}</p>
    </div>`).join("");
  box.innerHTML = stale + vague + unproven + deploy
    || `<p class="empty">Mọi tên trong khai báo đều có trong mã, đều đủ cụ thể để kiểm, và mọi cách kiểm đều đã chạy.</p>`;
}

function renderDetail() {
  const box = tab("detail");
  if (selectedEdge) { renderEdge(box, selectedEdge); return; }
  const n = selected && model.byName[selected];
  if (!n) {
    box.innerHTML = model.nodes.length
      ? `<p class="empty">Bấm vào một hộp hay một mũi tên trên sơ đồ để xem chi tiết và sửa.</p>`
      : `<p class="empty">Sơ đồ còn trống. Bấm <b>+ Thêm</b> để vẽ component đầu tiên.</p>`;
    return;
  }
  // Dòng của hộp phải đúng là khai báo của hộp đó: nút "lối vào từ ngoài"
  // mang số dòng của một `link`, sửa nó qua đây là sửa nhầm.
  const own = { component: ["component"], external: ["external"], store: ["store"], api: ["api"], service: ["service"] };
  const decl = (own[n.kind] || []).includes(model.byLine[n.line]?.keyword) ? model.byLine[n.line] : null;
  const mine = model.violations.filter((v) => v.from === n.name && !v.baselined);
  const kinds = { component: "component", store: "kho dữ liệu", api: "nhóm api", external: "bên ngoài", service: "service" };
  box.innerHTML = `
    <h3 style="margin:0 0 10px">${esc(label(n.name))}</h3>
    <dl>
      <dt>loại</dt><dd>${esc(kinds[n.kind])}</dd>
      <dt>phạm vi</dt><dd class="mono">${esc(n.sub) || "—"}</dd>
      <dt>trạng thái</dt><dd class="mono">${esc(n.status)}</dd>
      <dt>nguồn gốc</dt><dd>${n.owner === "ai" ? "agent đề xuất" : "người viết"}</dd>
      <dt>dòng</dt><dd>${n.line} trong system.arch</dd>
    </dl>
    <div class="row">${STATUS_ORDER.map((s) =>
      `<button data-status="${esc(s)}" ${s === n.status ? "disabled" : ""}>${esc(s)}</button>`).join("")}</div>
    <p class="muted" style="margin-top:8px">Từ <code>#accepted</code> trở lên là luật có hiệu lực.</p>
    ${decl ? `<pre class="preview mono">${esc(decl.text)}</pre>
    <div class="row actions">
      <button data-act="edit">Sửa</button>
      ${NAMED.includes(decl.keyword) ? `<button data-act="rename">Đổi tên</button>` : ""}
      <button data-act="delete" class="danger">Xoá</button>
    </div>` : ""}
    ${mine.length ? `<h4 style="margin:18px 0 8px">${mine.length} vi phạm từ đây</h4>` + mine.map(violationCard).join("") : ""}
  `;
  box.querySelectorAll("[data-status]").forEach((b) =>
    b.addEventListener("click", async () => {
      // Như mọi thay đổi luật: lý do vào nhật ký quyết định cùng thay đổi này.
      const answer = prompt(`Lý do đổi ${n.name} thành ${b.dataset.status} (bắt buộc, ghi vào decisions.md):`);
      if (answer === null) return; // bấm Huỷ: không đổi gì
      const reason = answer.trim();
      if (!reason) { alert("Phải ghi lý do: nó vào nhật ký quyết định cùng thay đổi này."); return; }
      if (await post("/api/status", { name: n.name, status: b.dataset.status, reason })) refresh();
    }));
  if (decl) bindDeclActions(box, decl);
}

/// Một mũi tên: luật nào sinh ra nó, gỡ riêng nó hay sửa cả luật.
function renderEdge(box, e) {
  const KIND = { allow: "được phép gọi", deny: "bị cấm gọi", link: "nối mạng tới", runs: "chạy mã của", violation: "vi phạm: đang gọi" };
  const decl = e.kind !== "violation" ? model.byLine[e.line] : null;
  const head = `<h3 style="margin:0 0 10px">${esc(label(e.from))} → ${esc(label(e.to))}</h3>
    <p class="muted">${esc(label(e.from))} ${esc(KIND[e.kind] || e.kind)} ${esc(label(e.to))}</p>`;
  if (e.kind === "violation") {
    const list = model.violations.filter((v) => v.from === e.from && v.to === e.to && !v.baselined);
    // Biến một vi phạm thành luật là quyết định kiến trúc: vẫn hỏi lý do.
    const canAllow = !e.from.startsWith(SVC) && !e.to.startsWith(SVC);
    box.innerHTML = head + list.map(violationCard).join("") +
      (canAllow ? `<div class="row actions"><button data-act="allow">Cho phép: thêm allow ${esc(e.from)} -> ${esc(e.to)}</button></div>` : "");
    box.querySelector('[data-act="allow"]')?.addEventListener("click", () =>
      openConnect(model.byName[e.from], model.byName[e.to], "allow"));
    return;
  }
  box.innerHTML = head + (decl ? `
    <p class="where mono">system.arch:${decl.line}${decl.locked ? " · đã khoá" : ""}</p>
    <pre class="preview mono">${esc(decl.text)}</pre>
    <div class="row actions">
      <button data-act="unlink" class="danger">Gỡ mũi tên này</button>
      <button data-act="edit">Sửa luật</button>
      <button data-act="delete" class="danger">Xoá cả dòng</button>
    </div>` : `<p class="muted">Không tìm thấy dòng sinh ra mũi tên này — tải lại trang.</p>`);
  if (!decl) return;
  bindDeclActions(box, decl);
  box.querySelector('[data-act="unlink"]').addEventListener("click", () => {
    const body = document.createElement("div");
    body.innerHTML = `<p>Bỏ <b class="mono">${esc(label(e.to))}</b> khỏi dòng này; hết đích thì xoá cả dòng.</p>
      <pre class="preview mono">${esc(decl.text)}</pre>`;
    openEditor("Gỡ mũi tên", body, () => ({ op: "disconnect", ...at(decl), to: e.to }));
  });
}

const VIA = {
  import: (s) => `import '${s}'`,
  table: (s) => `bảng '${s}'`,
  ffi: (s) => `gọi '${s}' qua ranh giới ngôn ngữ`,
  rpc: (s) => `gọi gRPC ${s}`,
  network: (s) => s,
  entry: (s) => s,
};
const violationCard = (v) => `
  <div class="card bad">
    <h4>${esc(label(v.from))} → ${esc(label(v.to))}</h4>
    <p class="where mono">${esc(v.file)}:${v.line}${v.count > 1 ? ` · ${v.count} lần` : ""}</p>
    <p class="mono">${esc((VIA[v.via] || ((s) => `dùng '${s}'`))(v.spec))}</p>
    <p class="muted">${esc(v.rule)}</p>
    <p class="hint">→ ${esc(v.hint)}</p>
  </div>`;

function renderViolations() {
  const box = tab("violations");
  const fresh = model.violations.filter((v) => !v.baselined);
  const old = model.violations.length - fresh.length;
  box.innerHTML = fresh.length
    ? fresh.map(violationCard).join("") + (old ? `<p class="muted">${old} vi phạm cũ đang được tha theo baseline.</p>` : "")
    : `<p class="empty">Không có vi phạm nào.${old ? `<br>${old} cái cũ đang được tha.` : ""}</p>`;
}

function renderProposals() {
  const box = tab("proposals");
  if (!model.proposals.length) {
    box.innerHTML = `<p class="empty">Không có đề xuất nào đang chờ.</p>`;
    return;
  }
  box.innerHTML = model.proposals.map((p) => `
    <div class="card">
      <h4>${p.intent === "block" ? "Bế tắc" : "Đề xuất"} · <span class="mono">${esc(p.id)}</span></h4>
      <p class="mono">${esc(p.statement)}</p>
      <p class="muted">${esc(p.reason)}</p>
      ${p.origin ? `<p class="where mono">${esc(p.origin)}</p>` : ""}
      <textarea placeholder="Lý do quyết định — bắt buộc" data-reason="${esc(p.id)}"></textarea>
      <div class="row">
        <button class="primary" data-accept="${esc(p.id)}">Duyệt</button>
        <button class="danger" data-reject="${esc(p.id)}">Từ chối</button>
      </div>
    </div>`).join("");

  for (const [attr, verdict] of [["data-accept", "accept"], ["data-reject", "reject"]]) {
    box.querySelectorAll(`[${attr}]`).forEach((b) =>
      b.addEventListener("click", async () => {
        const id = b.getAttribute(attr);
        const reason = box.querySelector(`[data-reason="${id}"]`).value.trim();
        if (!reason) { alert("Phải ghi lý do, kể cả khi duyệt."); return; }
        if (await post("/api/decide", { id, verdict, reason })) refresh();
      }));
  }
}

// ---------- sửa sơ đồ ----------
//
// Mọi thay đổi đi qua `/api/edit`. Máy chủ chạy lại bộ đọc luật trước khi
// ghi, nên form ở đây chỉ là cách gõ cho nhanh: gõ sai thì máy chủ từ chối
// và nói dòng nào sai, file luật không bao giờ hỏng.

const NAMED = ["component", "external", "store", "api", "service", "view", "boundary", "flow", "verify"];
// `expect` là nguyên văn cả khai báo, kể cả thân khối: máy chủ so cả khối để
// không ghi đè một thân `flow` đã đổi từ lúc tải.
const at = (decl) => ({ line: String(decl.line), expect: decl.text });
const field = (body, name) => body.querySelector(`[name="${name}"]`)?.value.trim() ?? "";

// Khai báo một dòng có form. Mỗi loại: các ô, cách ghép thành dòng, và cách
// tách một dòng có sẵn ra các ô (cùng cách cắt với bộ đọc luật).
const cut = (s, sep) => { const i = s.indexOf(sep); return i < 0 ? [s, ""] : [s.slice(0, i), s.slice(i + sep.length)]; };
const FORMS = {
  component: {
    help: "Một khối mã. Đường dẫn là glob, cách nhau bằng dấu phẩy.",
    fields: [["name", "Tên", "Order"], ["paths", "Đường dẫn", "src/order/**"]],
    build: (f) => `component ${f.name}${f.paths ? ` at ${f.paths}` : ""}`,
    parse: (b) => { const [n, p] = cut(b, " at "); return { name: n.trim(), paths: p.trim() }; },
  },
  external: {
    help: "Thư viện hay dịch vụ ngoài tầm kiểm soát: không soi bên trong.",
    fields: [["name", "Tên", "Stripe"], ["paths", "Đường dẫn (tuỳ chọn)", ""]],
    build: (f) => `external ${f.name}${f.paths ? ` at ${f.paths}` : ""}`,
    parse: (b) => { const [n, p] = cut(b, " at "); return { name: n.trim(), paths: p.trim() }; },
  },
  store: {
    help: "Kho dữ liệu: chỉ component chủ được truy cập trực tiếp.",
    fields: [["name", "Tên", "Orders"], ["owner", "Component chủ", "Order"], ["tables", "Bảng (tuỳ chọn)", "\"orders\", \"order_items\""]],
    build: (f) => `store ${f.name} owned_by ${f.owner}${f.tables ? ` at ${f.tables}` : ""}`,
    parse: (b) => { const [n, r] = cut(b, " owned_by "); const [o, t] = cut(r, " at "); return { name: n.trim(), owner: o.trim(), tables: t.trim() }; },
  },
  allow: {
    help: "Nguồn được phép gọi các đích. Không có allow là cấm.",
    fields: [["from", "Nguồn", "Web"], ["to", "Đích (phẩy)", "Order, Pay"]],
    build: (f) => `allow ${f.from} -> ${f.to}`,
    parse: (b) => { const [fr, t] = cut(b, "->"); return { from: fr.trim(), to: t.trim() }; },
  },
  deny: {
    help: "Cấm gọi, để nhấn mạnh và cho thông báo lỗi rõ hơn. Nguồn `*` là mọi component.",
    fields: [["from", "Nguồn", "*"], ["to", "Đích (phẩy)", "Db"], ["except", "Trừ (tuỳ chọn)", "Repo"]],
    build: (f) => `deny ${f.from} -> ${f.to}${f.except ? ` except ${f.except}` : ""}`,
    parse: (b) => { const [fr, r] = cut(b, "->"); const [t, e] = cut(r, " except "); return { from: fr.trim(), to: t.trim(), except: e.trim() }; },
  },
  api: {
    help: "Nhóm hàm hay từ khoá bị theo dõi, như strcpy, eval.",
    fields: [["name", "Tên", "Unsafe"], ["symbols", "Ký hiệu", "\"strcpy\", \"gets\""]],
    build: (f) => `api ${f.name} at ${f.symbols}`,
    parse: (b) => { const [n, s] = cut(b, " at "); return { name: n.trim(), symbols: s.trim() }; },
  },
  service: {
    help: "Một đơn vị triển khai. Nguồn: compose:<tên>, k8s:<tên>, tf:<địa chỉ>, dockerfile:<đường dẫn>.",
    fields: [["name", "Tên", "Api"], ["from", "Nguồn (tuỳ chọn)", "compose:api"], ["runs", "Chạy component (tuỳ chọn)", "Web, Order"]],
    build: (f) => `service ${f.name}${f.from ? ` from ${f.from}` : ""}${f.runs ? ` runs ${f.runs}` : ""}`,
    parse: (b) => { const [h, r] = cut(b, " runs "); const [n, fr] = cut(h, " from "); return { name: n.trim(), from: fr.trim(), runs: r.trim() }; },
  },
  link: {
    help: "Cạnh mạng được phép giữa hai service. `Internet` ở đầu là lộ ra ngoài.",
    fields: [["from", "Từ service", "Api"], ["to", "Tới service (phẩy)", "Db"]],
    build: (f) => `link ${f.from} -> ${f.to}`,
    parse: (b) => { const [fr, t] = cut(b, "->"); return { from: fr.trim(), to: t.trim() }; },
  },
  view: {
    help: "Lát cắt để xem riêng một phần. Không phải luật.",
    fields: [["name", "Tên", "Checkout"], ["members", "Component (phẩy)", "Web, Order"]],
    build: (f) => `view ${f.name}: ${f.members}`,
    parse: (b) => { const [n, m] = cut(b, ":"); return { name: n.trim(), members: m.trim() }; },
  },
};
// Khai báo nhiều dòng hay có biểu thức: sửa dạng chữ, máy chủ kiểm cú pháp.
const TEMPLATES = {
  flow: "flow Checkout:\n  Web -> Order.reserveStock -> Payment.charge",
  contract: "contract Payment.charge:\n  errors CardDeclined, Timeout",
  boundary: "boundary Checkout contains Order, Payment:\n  contain Timeout",
  invariant: "invariant data [system] mệnh đề cần giữ",
  verify: "verify unit runs \"cargo test\"",
};
const KINDS = [...Object.keys(FORMS), ...Object.keys(TEMPLATES)];

/// Tách chú thích `@owner #status` ở cuối dòng.
function splitMeta(line) {
  const tail = line.match(/(\s+[@#]\S*)+\s*$/);
  const meta = tail ? tail[0].trim().split(/\s+/) : [];
  return {
    body: tail ? line.slice(0, tail.index) : line.trimEnd(),
    owner: meta.find((t) => t === "@ai" || t === "@human") || "@human",
    status: meta.find((t) => STATUS_ORDER.includes(t)) || "#accepted",
  };
}

const dialog = document.getElementById("editor");
const edBody = document.getElementById("ed-body");
const edError = document.getElementById("ed-error");
const edReason = document.getElementById("ed-reason");
const edExtra = document.getElementById("ed-extra");
let editing = null;

function showError(msg, refs = []) {
  edError.hidden = false;
  edError.textContent = msg + (refs.length ? "\n\n" + refs.join("\n") : "");
}

/// Mở hộp thoại. `build()` trả về yêu cầu gửi `/api/edit` (chưa có lý do),
/// hay ném lỗi khi ô nhập còn thiếu.
function openEditor(title, body, build) {
  document.getElementById("ed-title").textContent = title;
  edBody.replaceChildren(body);
  edError.hidden = true;
  edExtra.hidden = true;
  editing = { build };
  dialog.showModal();
  (body.querySelector("input, select, textarea") || edReason).focus();
}

document.getElementById("ed-cancel").addEventListener("click", () => dialog.close());
document.getElementById("ed-form").addEventListener("submit", (ev) => { ev.preventDefault(); send({}); });
edExtra.addEventListener("click", () => send({ cascade: true }));

async function send(extra) {
  const reason = edReason.value.trim();
  if (!reason) { showError("Phải ghi lý do: nó vào nhật ký quyết định cùng thay đổi này."); edReason.focus(); return; }
  let payload;
  try { payload = editing.build(); } catch (e) { showError(String(e.message || e)); return; }
  const res = await fetch("/api/edit", {
    method: "POST",
    headers: { "X-Archctl-Key": sessionKey },
    body: JSON.stringify({ ...payload, ...extra, reason }),
  });
  const data = await res.json().catch(() => ({ ok: false, error: "máy chủ không trả lời" }));
  if (data.ok) {
    dialog.close();
    edReason.value = "";
    refresh();
    return;
  }
  if (data.why === "locked") {
    const yes = confirm(`Thao tác này sửa luật đã khoá (#locked):\n\n${data.refs.join("\n")}\n\nKhoá là để không ai lỡ tay đổi. Vẫn sửa?`);
    if (yes) send({ ...extra, confirmLocked: true });
    return;
  }
  showError(data.error, data.refs || []);
  if (data.why === "referenced" && !extra.cascade) {
    // Xoá kèm: gỡ tên khỏi danh sách đích, xoá luật chỉ còn trỏ tới nó.
    edExtra.textContent = "Xoá kèm các chỗ nhắc";
    edExtra.hidden = false;
  }
  if (data.why === "stale") refresh();
}

/// Thêm (`decl` null) hay sửa một khai báo. Khai báo một dòng có form; còn
/// lại, hay khi người muốn, sửa dạng chữ.
function openDeclEditor(decl, kind) {
  const body = document.createElement("div");
  const editingKind = decl ? decl.keyword : kind || "component";
  const single = decl ? !decl.text.includes("\n") : true;
  let mode = FORMS[editingKind] && single ? "form" : "text";
  const meta = decl ? splitMeta(decl.text.split("\n")[0]) : { owner: "@human", status: "#accepted" };

  const kindRow = document.createElement("label");
  kindRow.className = "field";
  kindRow.innerHTML = `<span>Loại</span>`;
  const select = document.createElement("select");
  for (const k of KINDS) select.append(new Option(k, k, false, k === editingKind));
  select.disabled = Boolean(decl);
  kindRow.append(select);

  const zone = document.createElement("div");
  const preview = document.createElement("pre");
  preview.className = "preview mono";
  const toggleText = document.createElement("button");
  toggleText.type = "button";
  toggleText.textContent = "Sửa dạng chữ";

  const statusRow = document.createElement("label");
  statusRow.className = "field";
  statusRow.innerHTML = `<span>Trạng thái</span>`;
  const status = document.createElement("select");
  for (const s of STATUS_ORDER) status.append(new Option(s, s, false, s === meta.status));
  statusRow.append(status);

  const formLine = () => {
    const spec = FORMS[select.value];
    const f = Object.fromEntries(spec.fields.map(([n]) => [n, field(zone, n)]));
    return `${spec.build(f)}  ${meta.owner} ${status.value}`;
  };
  const current = () => mode === "form" ? formLine() : zone.querySelector("textarea").value;

  function renderZone(text) {
    zone.replaceChildren();
    const spec = FORMS[select.value];
    if (mode === "form" && spec) {
      const help = document.createElement("p");
      help.className = "muted";
      help.textContent = spec.help;
      zone.append(help);
      const values = decl ? spec.parse(splitMeta(decl.text).body.slice(decl.keyword.length)) : {};
      for (const [name, text, hint] of spec.fields) {
        const row = document.createElement("label");
        row.className = "field";
        row.innerHTML = `<span>${esc(text)}</span>`;
        const input = document.createElement("input");
        input.type = "text";
        input.name = name;
        input.placeholder = hint;
        input.value = values[name] || "";
        input.addEventListener("input", () => { preview.textContent = formLine(); });
        row.append(input);
        zone.append(row);
      }
      zone.append(statusRow);
      zone.append(preview);
      preview.textContent = formLine();
      toggleText.hidden = false;
    } else {
      const area = document.createElement("textarea");
      area.className = "code";
      area.spellcheck = false;
      area.value = text ?? (decl ? decl.text : TEMPLATES[select.value] ?? `${select.value} `);
      const help = document.createElement("p");
      help.className = "muted";
      help.textContent = "Đúng một khai báo; dòng thân lùi vào. Máy chủ kiểm cú pháp và tham chiếu trước khi ghi.";
      zone.append(help, area);
      toggleText.hidden = true;
    }
  }
  status.addEventListener("change", () => { preview.textContent = formLine(); });
  select.addEventListener("change", () => { mode = FORMS[select.value] ? "form" : "text"; renderZone(); });
  toggleText.addEventListener("click", () => { const text = formLine(); mode = "text"; renderZone(text); });

  body.append(kindRow, zone, toggleText);
  renderZone();
  openEditor(decl ? `Sửa dòng ${decl.line}` : "Thêm vào sơ đồ", body, () => {
    const text = current();
    if (mode === "form") {
      const spec = FORMS[select.value];
      const missing = spec.fields.filter(([n, t]) => !t.includes("tuỳ chọn") && !field(zone, n));
      if (missing.length) throw new Error(`Còn thiếu: ${missing.map(([, t]) => t).join(", ")}`);
    }
    return decl ? { op: "replace", ...at(decl), text } : { op: "add", text };
  });
}

function bindDeclActions(box, decl) {
  box.querySelector('[data-act="edit"]')?.addEventListener("click", () => openDeclEditor(decl));
  box.querySelector('[data-act="rename"]')?.addEventListener("click", () => {
    const body = document.createElement("div");
    body.innerHTML = `<p class="muted">Đổi cả tên ở mọi chỗ nhắc tới: luật, store, service, view, boundary, contract, flow.</p>
      <label class="field"><span>Tên mới</span><input type="text" name="to"></label>`;
    body.querySelector("input").value = splitMeta(decl.text).body.split(/\s+/)[1]?.replace(/[:.].*$/, "") || "";
    openEditor(`Đổi tên (dòng ${decl.line})`, body, () => {
      const to = field(body, "to");
      if (!to) throw new Error("Chưa có tên mới");
      return { op: "rename", ...at(decl), to };
    });
  });
  box.querySelector('[data-act="delete"]')?.addEventListener("click", () => {
    const body = document.createElement("div");
    body.innerHTML = `<p>Xoá khai báo này khỏi <code>system.arch</code>:</p><pre class="preview mono">${esc(decl.text)}</pre>`;
    openEditor(`Xoá dòng ${decl.line}`, body, () => ({ op: "delete", ...at(decl) }));
  });
}

/// Nối hai hộp: component, store, api dùng `allow`/`deny`; hai service dùng `link`.
function openConnect(from, to, preset) {
  const services = from.kind === "service" && to.kind === "service";
  if (from.kind === "service" !== (to.kind === "service")) {
    alert("Chỉ nối được hai service với nhau (link), hay hai hộp mã với nhau (allow/deny). Service chạy component nào thì sửa service.");
    return;
  }
  const body = document.createElement("div");
  body.innerHTML = `<p><b class="mono">${esc(label(from.name))}</b> → <b class="mono">${esc(label(to.name))}</b></p>
    <label class="field"><span>Loại</span><select name="kind"></select></label>`;
  const select = body.querySelector("select");
  for (const [k, t] of services ? [["link", "link — được nối mạng"]]
    : [["allow", "allow — được phép gọi"], ["deny", "deny — cấm gọi"]]) {
    select.append(new Option(t, k, false, k === preset));
  }
  openEditor("Nối mũi tên", body, () => ({ op: "connect", kind: select.value, from: from.name, to: to.name }));
}

/// Mọi khai báo trong file, theo thứ tự, kể cả thứ không vẽ thành hộp.
function renderDecls() {
  const box = tab("decls");
  const list = model.decls || [];
  box.innerHTML = `<div class="row" style="margin:0 0 12px"><button class="primary" data-add>+ Thêm khai báo</button></div>` +
    (list.length ? list.map((d) => `
      <div class="decl" data-line="${d.line}">
        <div class="badge">dòng ${d.line} · ${esc(d.keyword)}${d.locked ? " · đã khoá" : ""}</div>
        <pre class="mono">${esc(d.text)}</pre>
        <div class="row">
          <button data-act="edit">Sửa</button>
          ${NAMED.includes(d.keyword) ? `<button data-act="rename">Đổi tên</button>` : ""}
          <button data-act="delete" class="danger">Xoá</button>
        </div>
      </div>`).join("") : `<p class="empty">File luật chưa có khai báo nào.</p>`);
  box.querySelector("[data-add]").addEventListener("click", () => openDeclEditor(null));
  box.querySelectorAll(".decl").forEach((card) => bindDeclActions(card, model.byLine[card.dataset.line]));
}

// ---------- cập nhật trực tiếp ----------

new EventSource("/api/events?k=" + encodeURIComponent(sessionKey)).onmessage = refresh;
addEventListener("resize", () => {
  // Cửa sổ đổi kích thước mà người chưa đụng vào thì canh lại cho vừa.
  if (!userMoved) fitToView();
  draw();
});
refresh();
</script>
