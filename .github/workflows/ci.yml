# CI không chép lại các lệnh kiểm — nó chạy những gì `.arch/system.arch` khai
# báo. Thêm một dòng `verify <tên> runs "<lệnh>"` vào file luật là CI chạy
# thêm cái đó, không phải sửa file này. Ngược lại cũng đúng: file này không
# biết `cargo test` hay `cargo clippy` nằm ở đâu, nên không có bản sao nào để
# lệch khỏi file luật.
#
# Không dùng action của bên thứ ba. `arch-core` không có dependency nào ngoài
# std vì công cụ chạy trong repo người dùng; một action lạ ở đây cũng là mã
# người khác chạy trên repo này, với cùng lý do để từ chối. `actions/checkout`
# là của GitHub và được ghim theo SHA chứ không theo nhãn: nhãn `v7` có thể bị
# dời sang commit khác, SHA thì không.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Tuỳ cấu hình repo, mặc định của GitHub có thể là ghi được. Không việc nào ở
# đây cần ghi gì, nên nói rõ ra.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Repo không có dependency nào, nên cargo không cần mạng sau khi checkout.
  # Cắt mạng ở đây làm `verify no_deps` có thêm một lớp nữa: thêm một crate
  # vào Cargo.toml thì build đổ ngay, chứ không chỉ đếm dòng trong Cargo.lock.
  # Đã kiểm với `CARGO_HOME` rỗng: build release và clippy đều chạy offline.
  CARGO_NET_OFFLINE: "true"

# Mặc định của GitHub là sáu tiếng. Một lần mạng treo hay một test kẹt thì
# không ai muốn chờ chừng đó mới biết.
#
# Ghim `ubuntu-24.04` thay vì `ubuntu-latest`: nhãn đó chuyển sang Ubuntu 26
# từ 19/10/2026, và môi trường đổi ngầm thì một lần đỏ không biết là do mã
# hay do runner. Nâng là sửa ba dòng này, có chủ ý.
jobs:
  luat:
    name: luật
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: lấy mã
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `archctl diff` đọc file luật ở nhánh gốc bằng `git show`, nên cần
          # lịch sử chứ không phải một commit lẻ.
          fetch-depth: 0
          persist-credentials: false

      - name: clippy
        # Image của GitHub có sẵn, nhưng `verify lint` sẽ đổ một cách khó hiểu
        # nếu một ngày nào đó không còn.
        run: rustup component add clippy

      - name: dựng archctl
        run: cargo build --release --locked

      # Chỉ để đọc, không chặn. Việc của nó là đưa thay đổi của file luật vào
      # log, nơi người review nhìn thấy — kể cả `verify ... runs "<lệnh>"`,
      # vì lệnh đó nằm trong `arch_hash`. Một PR đổi lệnh kiểm thành
      # `curl ... | sh` hiện ra ở đây.
      #
      # `continue-on-error` vì một PR tách ra từ trước khi có file luật thì
      # `git show <base>:.arch/system.arch` không có gì để đọc, và đó không
      # phải lỗi của PR.
      - name: luật đã đổi gì
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: ./target/release/archctl diff "$BASE"

      # Lệnh duy nhất trong cả công cụ chạy shell, và nó chạy đúng những gì
      # file luật khai báo.
      - name: chạy các cách kiểm đã khai báo
        run: ./target/release/archctl verify

      # Phải sau `verify`: `--strict` coi "chưa có biên nhận" là vi phạm, mà
      # bản checkout mới thì chưa có biên nhận nào (`.arch/.verified` không
      # vào git — một biên nhận commit được là một biên nhận bịa được).
      - name: đối chiếu mã với luật
        run: ./target/release/archctl check --strict

  nen-tang:
    name: nền tảng khác
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: lấy mã
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: dựng archctl
        run: cargo build --release --locked

      # Cố ý gọi `cargo test` thẳng, không qua `archctl verify`. Job `luật`
      # uỷ quyền việc chạy test cho chính công cụ đang được test: nếu
      # `cmd_verify` hỏng thành không-làm-gì, nó vẫn ghi biên nhận, `check`
      # vẫn thấy biên nhận mới, và cả CI thành mù mà không đỏ một ô nào. Một
      # lần gọi thẳng ở đây cắt vòng tròn đó — và đồng thời trả lời câu hỏi
      # khác: công cụ viết trên macOS có chạy ở nơi khác không.
      - name: test, gọi thẳng cargo
        run: cargo test --locked --quiet

  msrv:
    name: rust tối thiểu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: lấy mã
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Lấy số từ chính Cargo.toml thay vì ghi lại ở đây, để không có hai bản
      # cùng khai một con số. `rust-version` từng ghi 1.85 trong khi mã dùng
      # let-chain của 1.88: không có job nào kiểm thì nó sai im lặng.
      - name: đọc rust-version từ Cargo.toml
        id: doc
        run: |
          set -euo pipefail
          v=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml | head -1)
          test -n "$v"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      # Qua biến môi trường, không nội suy thẳng vào dòng shell: giá trị đọc
      # từ file trong repo là dữ liệu, và repo là thứ một PR sửa được.
      - name: cài toolchain đã khai
        env:
          V: ${{ steps.doc.outputs.v }}
        run: rustup toolchain install "$V" --profile minimal --no-self-update

      - name: biên dịch bằng toolchain đó
        env:
          V: ${{ steps.doc.outputs.v }}
        run: cargo "+$V" check --locked --all-targets

  bench:
    name: repo thật
    runs-on: ubuntu-24.04
    # Bước đối chiếu với clang chạy qua ~4 000 file C/C++ trên hai lõi, và
    # thước đo tên máy trong chuỗi parse đầy đủ mọi file Python, Go; sabotage
    # chạy lại cả bước đối chiếu cho từng kiểu phá. Trần này để bắt treo.
    timeout-minutes: 40
    steps:
      - name: lấy mã
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: dựng archctl
        run: cargo build --release --locked

      # Tải hai mươi chín repo ở đúng commit ghim trong `bench/repos.tsv`, rồi chạy hai
      # phép thử. Luật do `init --from-code` sinh ra, nâng lên `#accepted`,
      # kiểm lại chính mã đó thì phải ra 0 vi phạm — mỗi vi phạm là một chỗ bộ
      # khám phá và bộ kiểm chứng nhìn khác nhau. Và mọi lệnh phải chạy được
      # trên mã người khác viết, không chỉ trên fixture viết riêng để test.
      #
      # Mã thoát 2 là không tải được repo: mạng, không phải archctl. Thời gian
      # được in nhưng không chặn, nên một lần đo là đủ.
      - name: tự nhất quán và luồng lệnh
        run: python3 bench/bench.py --archctl target/release/archctl --rounds 1

      # Bộ đo bắt được lỗi chỉ khi từng phép kiểm của nó đổ được. Bước này phá
      # archctl năm mươi sáu kiểu và đòi bộ đo bắt đúng từng kiểu — nếu một lần sửa sau
      # này vô tình làm một phép kiểm luôn đạt, nó đỏ ở đây.
      #
      # `--rust-repo` phá thêm phần Rust của bước đối chiếu bên dưới, phần dùng
      # `syn` tải từ crates.io — nên bước này cũng mở lại mạng cho cargo, như
      # bước đối chiếu. archctl đã dựng xong ở trên khi còn offline.
      # `--notebook-repo` phá phần notebook, đối chiếu bằng IPython cài qua pip.
      # `--deploy-repo` phá phần compose và Dockerfile, đối chiếu bằng PyYAML và
      # dockerfile-parse cài qua pip, cũng ghim kèm hash. `--k8s-repo` phá phần
      # manifest Kubernetes và cạnh qua Service, đối chiếu bằng PyYAML cùng venv. `--proto-repo` phá
      # phần `.proto`, đối chiếu bằng `protoc` của grpcio-tools cài y như vậy.
      # Phần cạnh binding (matplotlib, pytorch-image-models, vllm) cần clang, có
      # sẵn trên image.
      - name: bộ đo đổ được
        env:
          CARGO_NET_OFFLINE: "false"
        run: python3 bench/sabotage.py --archctl target/release/archctl --rust-repo ripgrep --notebook-repo matplotlib --deploy-repo example-voting-app --k8s-repo microservices-demo --proto-repo vllm

      # Phép tự nhất quán ở trên so archctl với chính nó: bộ khám phá và bộ
      # kiểm dùng chung bộ trích, nên một lỗi trong bộ trích làm cả hai sai
      # giống nhau mà vẫn ra "0 bất nhất". Vue core từng mất 21% import tĩnh
      # như vậy. Bước này đối chiếu với parser chuẩn: `ast` của Python, lexer
      # thô của clang, parser module của Node, `go/parser` của Go — cho import,
      # và cho cạnh Python ↔ native (module mở rộng, op PyTorch).
      #
      # Image ghim ở trên có sẵn cả bốn (Python 3.12, Clang 18, Node 22 — đủ
      # mới cho `module.stripTypeScriptTypes` —, Go). `--require` để ngày nào
      # image thiếu một cái thì bước này đỏ, thay vì lặng lẽ bỏ qua phần đó.
      #
      # Rust đối chiếu với `syn`, phải tải từ crates.io, nên riêng bước này mở
      # lại mạng cho cargo. archctl đã dựng xong ở trên khi còn offline; crate
      # tải về chỉ vào trình đọc của bộ đo dưới `target/bench/syn-oracle/`,
      # không vào archctl. Phiên bản ghim `=` trong `SYN_MANIFEST` của oracle.py.
      #
      # Notebook đối chiếu với IPython, cài bằng pip vào venv dưới
      # `target/bench/ipython-oracle/`. Mọi gói ghim `==` kèm sha256 trong
      # `bench/ipython-requirements.txt`, chỉ wheel: không file nào khác bản đã
      # ghim, không `setup.py` nào chạy lúc cài. Job chỉ có quyền đọc, không secret.
      # Compose và Dockerfile đối chiếu với PyYAML và dockerfile-parse, cài y như
      # vậy từ `bench/deploy-requirements.txt`. File `.proto` đối chiếu với
      # `protoc` (grpcio-tools), từ `bench/proto-requirements.txt`. Chart Helm đối
      # chiếu với `helm template` bản ghim (tải từ get.helm.sh, kiểm sha256 của
      # tarball, xem `HELM_SHA256` trong `bench/oracle.py`).
      - name: đối chiếu với parser chuẩn
        env:
          CARGO_NET_OFFLINE: "false"
        run: python3 bench/oracle.py --archctl target/release/archctl --require clang,node,go,syn,ipython,deploy,proto,helm,kustomize

  mo-hinh:
    name: kiến trúc mô hình
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: lấy mã
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: dựng archctl
        run: cargo build --release --locked

      # Công thức trong `docs/ml.md`: archctl không đọc được layer của mô hình
      # từ mã nguồn, nên `verify model_arch` dựng mô hình thật rồi so cây module
      # với bản đã duyệt. Cần torch. Mọi gói ghim `==` kèm sha256 trong
      # `examples/ml/requirements-test.txt`, chỉ wheel, không `setup.py` nào chạy
      # lúc cài. Linux lấy torch bản CPU (196 MB) từ index của PyTorch; bản trên
      # PyPI là bản CUDA. Job chỉ có quyền đọc, không secret.
      - name: cài torch bản CPU và pytest
        run: |
          python3 -m venv target/ml-venv
          target/ml-venv/bin/python -m pip install --quiet --disable-pip-version-check \
            --require-hashes --only-binary :all: --no-deps \
            -r examples/ml/requirements-test.txt

      # `verify` chạy lệnh đã khai trong `examples/ml/.arch/system.arch`, với
      # `python3` của venv. Kiến trúc khác `tests/model_arch.txt` thì đỏ.
      - name: chụp kiến trúc mô hình, so với bản đã duyệt
        working-directory: examples/ml
        run: PATH="$GITHUB_WORKSPACE/target/ml-venv/bin:$PATH" ../../target/release/archctl verify model_arch
