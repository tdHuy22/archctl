apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels:
    app: cart
spec:
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      containers:
      - name: server
        image: cart:1.0
        command: ["python", "-m", "cart"]
        env:
        - name: REDIS_ADDR
          value: redis-cart:6379
        - name: MODE
          valueFrom:
            configMapKeyRef:
              name: settings
              key: mode
        envFrom:
        - configMapRef:
            name: settings
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cart
spec:
  selector:
    app: cart
  ports:
  - port: 80
    targetPort: 8080
