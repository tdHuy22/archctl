{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
      - name: redis
        image: {{ .Values.global.registry }}/{{ .Values.image }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
{{- end }}
